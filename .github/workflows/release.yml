name: Release

# Builds both zips and publishes them as GitHub release v<VERSION>.
# Run it from the Actions tab (it creates the tag), or push the tag yourself.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Work out the tag from VERSION
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($tag)" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build
        run: python build.py

      - name: Syntax-check the built scripts
        run: for f in dist/chrome/*.js dist/firefox/*.js; do node --check "$f"; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/aloud-*.zip dist/updates.json --target "$GITHUB_SHA" --title "Aloud ${TAG#v}" --generate-notes
