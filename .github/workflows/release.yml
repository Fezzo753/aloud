name: Release

# Pushing a tag like v1.1.0 builds both zips and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Build
        run: python build.py

      - name: Syntax-check the built scripts
        run: for f in dist/chrome/*.js dist/firefox/*.js; do node --check "$f"; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/aloud-*.zip --title "Aloud ${GITHUB_REF_NAME#v}" --generate-notes
